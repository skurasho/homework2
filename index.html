<!DOCTYPE html>
<html lang="en"></html>
<head>
    <meta charset="UTF-8">
    <title>document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap:56px;
            padding: 56px 32px;
        }
        .cube{
            width: 170px;
            height: 170px;
            transition: transform .25s, box-shadow .25s; 
        }
        .cube:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(0,0,0,.28);
        }
        .cube::after{
            content: "hover";
            display: none;              /* 默认隐藏 */
        }
        .cube:hover::after{
            display: flex;              /* 悬停才出现 */
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 1px 4px rgba(0,0,0,.45);
        }
        .c1{
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 0 10px 24px rgba(255,94,98,.35);
        }
        .c2{
            background: aquamarine;
            border-radius:18px;
            box-shadow: 0 10 24px rgba(60,200,90,.35);
        }
        .c3{
            background: linear-gradient(135deg,#d8b8ff,#5c22b8);
            border-radius:24px;
            box-shadow: 0 10 24px rgba(92,34,184,.80);
        }
        .c4{
            background: linear-gradient(135deg,#fff299,#ffc107);
            border-radius: 50%;
            box-shadow: 0 10px 24px rgba(255,193,7);
        }
        .c5{
            background: green;
            border-radius:12px;
            box-shadow: 0 10 24px  rgba(100,200,90,.90);;
        }
        .c6{
            background: linear-gradient(135deg,#b82eff,#c9a0ff);
            border-radius: 50%;
            box-shadow: 0 10px 24px rgb(241, 136, 159,.90);
        }
    </style>
</head>

<body>
    <div class="cube c1"></div>
    <div class="cube c2"></div>
    <div class="cube c3"></div>
    <div class="cube c4"></div>
    <div class="cube c5"></div>
    <div class="cube c6"></div>
</body>
